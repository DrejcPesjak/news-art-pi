<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1760" viewBox="0 0 1660 1760" role="img" aria-labelledby="title description">
<title id="title">Original Inko versus our final Inko: architecture, storage, memory and training</title>
<desc id="description">Parallel original and final Inko pipelines, with training processes alongside them. The final text assets occupy 626.6 MiB on disk while their process used 127.3 MiB peak RAM in the measured laptop run. The generator retains its dense 25-block architecture; adapters learned guided interval velocities and were merged before quantization. The final decoder is a separate TAESD-derived architecture trained on Qwen reference images. Storage figures and measured process memory are labeled separately.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#718178"/></marker>
  <marker id="change" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#286c54"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#233a31}
    .title{font-family:Georgia,serif;font-size:48px;letter-spacing:-1px}
    .eyebrow{font-size:13px;letter-spacing:2px;font-weight:700;fill:#286c54}
    .heading{font-size:24px;font-weight:700}
    .stage{font-size:23px;font-weight:700}
    .step-number{font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .stat-label{font-size:11px;letter-spacing:1px;font-weight:700;fill:#53685d}
    .stat-value{font-size:29px;font-weight:700;fill:#286c54}
    .body{font-size:19px}
    .small{font-size:17px;fill:#53685d}
    .tiny{font-size:15px;fill:#53685d}
    .metric{font-size:32px;font-weight:700}
    .label{font-size:12px;letter-spacing:1.2px;font-weight:700;fill:#53685d}
    .green{fill:#286c54}
    .process{font-size:17px;letter-spacing:.5px;font-weight:700;fill:#286c54}
    .white{fill:#ffffff}
    .pale{fill:#d8e7de}
    .flow{fill:none;stroke:#718178;stroke-width:2.5;marker-end:url(#arrow)}
    .change{fill:none;stroke:#286c54;stroke-width:2;marker-end:url(#change)}
    .dash{fill:none;stroke:#b2c5b8;stroke-width:2;stroke-dasharray:5 5}
  </style>
</defs>
<rect width="1660" height="1760" fill="#f6f3ec"/>
<text class="eyebrow" x="48" y="48">NEWS ART PI · ARCHITECTURE + TRAINING · 26 NOVEMBER 2026</text>
<text class="title" x="48" y="112">Original Inko → our eight-pass Inko</text>
<text class="body" x="48" y="154">Same text features and dense generator. Compressed storage, distilled sampling, a new tiny decoder, and sequential execution.</text>

<!-- Column headings -->
<rect x="48" y="194" width="470" height="60" rx="11" fill="#e6e4dc"/>
<text class="heading" x="70" y="233">ORIGINAL INKO</text>
<rect x="548" y="194" width="560" height="60" rx="11" fill="#dcece0"/>
<text class="heading green" x="570" y="233">OUR FINAL CANDIDATE</text>
<rect x="1148" y="194" width="464" height="60" rx="11" fill="#e3e9ee"/>
<text class="heading" x="1170" y="233">WHAT WE DID</text>

<!-- Text encoder -->
<rect x="48" y="275" width="470" height="255" rx="13" fill="#fffdf8" stroke="#d6d9ce"/>
<circle cx="81" cy="307" r="15" fill="#e6e4dc"/>
<text class="step-number" x="81" y="307">1</text>
<text class="stage" x="108" y="315">Qwen3-0.6B text encoder</text>
<text class="body" x="70" y="354">596M parameters · 28 blocks total</text>
<text class="small" x="70" y="386">Original Inko already reads only the first 20.</text>
<text class="small" x="70" y="417">Downloaded checkpoint: BF16 weights</text>
<text class="label" x="70" y="458">ON DISK · FULL CHECKPOINT WEIGHTS</text>
<text class="metric" x="70" y="499">1,136.9 MiB</text>

<rect x="548" y="275" width="560" height="255" rx="13" fill="#fffdf8" stroke="#aac6b1"/>
<circle cx="581" cy="307" r="15" fill="#dcece0"/>
<text class="step-number" x="581" y="307">1</text>
<text class="stage" x="608" y="315">Same first 20 blocks</text>
<text class="body" x="570" y="354">Q8 linear weights · FP16 mapped embeddings</text>
<text class="small" x="570" y="386">FP32 norms · no text-encoder retraining</text>
<text class="small" x="570" y="417">Gather only the embedding rows for this caption.</text>
<!-- Aligned disk and RAM statistics, with equal padding and shared baselines. -->
<rect x="570" y="438" width="516" height="75" rx="9" fill="#f0f4ed"/>
<line x1="818" y1="450" x2="818" y2="501" stroke="#d2dfd4"/>
<text class="stat-label" x="586" y="460">ON DISK · TEXT ASSETS</text>
<text class="stat-value" x="586" y="495">626.6 MiB</text>
<text class="stat-label" x="836" y="460">PEAK PROCESS RAM*</text>
<text class="stat-value" x="836" y="495">127.3 MiB</text>
<path class="change" d="M521 403H541"/>
<path class="dash" d="M1111 403H1145"/>

<rect x="1148" y="275" width="464" height="255" rx="13" fill="#edf1f3"/>
<text class="process" x="1170" y="315">EXPORT + QUANTIZE + MEMORY-MAP</text>
<text class="small" x="1170" y="354">Leave out unused blocks 21–28.</text>
<text class="small" x="1170" y="386">Keep the original layer-20 feature convention.</text>
<text class="small" x="1170" y="429">Map the 296.75 MiB embedding table;</text>
<text class="small" x="1170" y="459">read just the required token rows.</text>
<text class="tiny" x="1170" y="500">626.6 MiB is a file size, not a RAM requirement.</text>

<path class="flow" d="M283 537V577"/>
<path class="flow" d="M828 537V577"/>
<text class="tiny" x="304" y="564">text features</text>
<text class="tiny" x="849" y="564">text features</text>

<!-- Flow transformer -->
<rect x="48" y="591" width="470" height="319" rx="13" fill="#fffdf8" stroke="#d6d9ce"/>
<circle cx="81" cy="623" r="15" fill="#e6e4dc"/>
<text class="step-number" x="81" y="623">2</text>
<text class="stage" x="108" y="631">Flow-matching transformer</text>
<text class="body" x="70" y="670">25 blocks · 532.5M parameters</text>
<text class="small" x="70" y="702">1 double-stream + 24 single-stream blocks</text>
<text class="label" x="70" y="747">ON DISK · BF16 WEIGHTS</text>
<text class="metric" x="70" y="787">1,015.7 MiB</text>
<line x1="70" y1="810" x2="496" y2="810" stroke="#d6d9ce"/>
<text class="body" x="70" y="847">20 steps · CFG 4.5</text>
<text class="small" x="70" y="881">40 model evaluations per image</text>

<rect x="548" y="591" width="560" height="319" rx="13" fill="#fffdf8" stroke="#aac6b1"/>
<circle cx="581" cy="623" r="15" fill="#dcece0"/>
<text class="step-number" x="581" y="623">2</text>
<text class="stage" x="608" y="631">Same dense 25-block transformer</text>
<text class="body" x="570" y="670">Same 532.5M parameters · merged LoRA</text>
<text class="small" x="570" y="702">Q4 attention / MLP · Q8 modulation · FP32 small weights</text>
<!-- Aligned disk and RAM statistics, with equal padding and shared baselines. -->
<rect x="570" y="724" width="516" height="75" rx="9" fill="#f0f4ed"/>
<line x1="818" y1="736" x2="818" y2="787" stroke="#d2dfd4"/>
<text class="stat-label" x="586" y="746">ON DISK · PACKED WEIGHTS</text>
<text class="stat-value" x="586" y="781">361.7 MiB</text>
<text class="stat-label" x="836" y="746">PEAK PROCESS RAM*</text>
<text class="stat-value" x="836" y="781">212.3 MiB</text>
<line x1="570" y1="810" x2="1086" y2="810" stroke="#c7dbcd"/>
<text class="body" x="570" y="847">8 steps · CFG 1</text>
<text class="small" x="570" y="881">8 evaluations · 5× fewer than the reference</text>
<path class="change" d="M521 750H541"/>
<path class="dash" d="M1111 750H1145"/>

<rect x="1148" y="591" width="464" height="319" rx="13" fill="#edf1f3"/>
<text class="process" x="1170" y="631">DISTILL → MERGE → QUANTIZE</text>
<text class="small" x="1170" y="670">24-step / CFG-4.5 teacher trajectories</text>
<text class="small" x="1170" y="700">→ average-velocity targets for an 8-step student.</text>
<text class="small" x="1170" y="739">344 trajectories · rank-32 LoRA · 3,000 updates.</text>
<text class="small" x="1170" y="769">Train adapters, then merge updates into weights.</text>
<text class="small" x="1170" y="808">Then quantize + groupwise Hessian correction.</text>
<text class="small" x="1170" y="838">Q8 modulation chosen with development checks.</text>
<text class="tiny" x="1170" y="881">Velocity loss, not intermediate-activation matching.</text>

<path class="flow" d="M283 917V957"/>
<path class="flow" d="M828 917V957"/>
<text class="tiny" x="304" y="944">16-channel latent</text>
<text class="tiny" x="849" y="944">16-channel latent</text>

<!-- Decoder -->
<rect x="48" y="971" width="470" height="283" rx="13" fill="#fffdf8" stroke="#d6d9ce"/>
<circle cx="81" cy="1003" r="15" fill="#e6e4dc"/>
<text class="step-number" x="81" y="1003">3</text>
<text class="stage" x="108" y="1011">Original Qwen VAE</text>
<text class="body" x="70" y="1050">126.9M parameters in the full VAE</text>
<text class="small" x="70" y="1082">Its decoder: 73.3M parameters</text>
<text class="small" x="70" y="1112">14 residual blocks + attention</text>
<text class="label" x="70" y="1157">ON DISK · FULL BF16 VAE PACKAGE</text>
<text class="metric" x="70" y="1198">242.0 MiB</text>
<text class="tiny" x="70" y="1230">Package includes encoder; generation uses decoder.</text>

<rect x="548" y="971" width="560" height="283" rx="13" fill="#fffdf8" stroke="#aac6b1"/>
<circle cx="581" cy="1003" r="15" fill="#dcece0"/>
<text class="step-number" x="581" y="1003">3</text>
<text class="stage" x="608" y="1011">New TAESD-derived decoder</text>
<text class="body" x="570" y="1050">Different architecture · 1.229M parameters</text>
<text class="small" x="570" y="1082">10 residual blocks · 35 conv layers · no attention</text>
<text class="small" x="570" y="1112">About 60× fewer parameters than the original decoder.</text>
<!-- Aligned disk and RAM statistics, with equal padding and shared baselines. -->
<rect x="570" y="1137" width="516" height="75" rx="9" fill="#f0f4ed"/>
<line x1="818" y1="1149" x2="818" y2="1200" stroke="#d2dfd4"/>
<text class="stat-label" x="586" y="1159">ON DISK · FP16 NCNN</text>
<text class="stat-value" x="586" y="1194">2.35 MiB</text>
<text class="stat-label" x="836" y="1159">PEAK PROCESS RAM*</text>
<text class="stat-value" x="836" y="1194">248.1 MiB</text>
<text class="tiny" x="570" y="1230">16-channel normalized Inko latent in; RGB image out.</text>
<path class="change" d="M521 1111H541"/>
<path class="dash" d="M1111 1111H1145"/>

<rect x="1148" y="971" width="464" height="283" rx="13" fill="#edf1f3"/>
<text class="process" x="1170" y="1011">DISTILL THE DECODER</text>
<text class="small" x="1170" y="1050">TAESD initialization; adapt 4 → 16 input channels.</text>
<text class="small" x="1170" y="1082">Train all weights on Qwen reference images.</text>
<text class="small" x="1170" y="1112">Pixel + structure + image-gradient losses.</text>
<text class="small" x="1170" y="1157">6,000 updates · 312 train / 32 validation.</text>
<text class="small" x="1170" y="1187">25.05 dB PSNR · 0.7996 SSIM.</text>
<text class="tiny" x="1170" y="1230">Lossy substitution; not a smaller copy of Qwen VAE.</text>

<!-- Output -->
<path class="flow" d="M283 1261V1300"/>
<path class="flow" d="M828 1261V1300"/>
<rect x="48" y="1315" width="470" height="70" rx="12" fill="#e6e4dc"/>
<text class="stage" x="70" y="1346">Guided reference image</text>
<text class="tiny" x="70" y="1370">Generally richer texture; subject errors still occur.</text>
<rect x="548" y="1315" width="560" height="70" rx="12" fill="#dcece0"/>
<text class="stage green" x="570" y="1346">384 × 384 candidate image</text>
<text class="tiny" x="570" y="1370">48 × 48 latent → 24 × 24 image tokens.</text>
<text class="small" x="1170" y="1344">Lower resolution → smaller image activations.</text>
<text class="tiny" x="1170" y="1371">Text activations depend on caption length.</text>

<!-- Explicit distinction behind the encoder-size question -->
<rect x="48" y="1410" width="1564" height="153" rx="13" fill="#e9e8de"/>
<text class="process" x="70" y="1445">WHY 626.6 MiB ON DISK, BUT 127.3 MiB IN RAM?</text>
<text class="body" x="70" y="1481">Disk holds every exported text weight and embedding row. The process uses only the needed rows and expands matrices in pieces.</text>
<text class="small" x="70" y="1513">Peak RAM also includes activations and workspaces: the 2.35 MiB decoder therefore uses about 248 MiB while producing pixels.</text>
<text class="tiny" x="70" y="1542">* RSS for each child in one 384px laptop run; not fixed RAM guarantees. The OS may also cache file data outside that process’s RSS.</text>

<!-- Runtime -->
<rect x="48" y="1586" width="1564" height="90" rx="13" fill="#254737"/>
<text class="body white" x="70" y="1622">Text encoder → exits → generator → exits → decoder. Fresh sequential processes; their peak RAM values are not added.</text>
<text class="small pale" x="70" y="1654">Q4 / Q8 describe storage; matrix math is FP32. Measured: 45.9 s with 4 CPU threads; 248 MiB largest child peak. Pi speed is unverified.</text>

<text class="tiny" x="48" y="1710">Quality fallback retained: original guided quantized Inko + exact one-frame Qwen decoder (25.3M parameters / 48.3 MiB). The 244M pruned model was rejected.</text>
<text class="tiny" x="48" y="1738">Default remains 8 steps / CFG 1. CFG 2 has mixed preferences; CFG 1.5 is untested. Architecture and model settings were not changed for this drawing.</text>
</svg>
