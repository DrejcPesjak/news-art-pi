# Edit this file and push to deploy. The Pi applies it automatically.
# See FILTERS.md for search examples, art styles, and deployment instructions.
[news]
# One provider: Google News RSS. Empty query = general English US-edition news.
# Examples: "sports", "Spain", "sports Spain", "science OR technology".
query = ""
language = "en-US"
country = "US"
max_age_hours = 48

[generation]
backend = "supra"
image_size = 256
# Free-text style appended to the short, name-stripped scene caption.
style = "oil painting"
# Local Supra2 + distilled decoder; these defaults were measured on this Pi.
steps = 25
guidance = 3.0
seed = 0
threads = 4
memory_mib = 480
timeout_seconds = 900

[display]
refresh_seconds = 600
title = "THE WORLD, REIMAGINED"

